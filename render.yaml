services:
  - type: web
    name: trustmarket-ghana-api
    runtime: node
    # Render needs Node 22+ for built-in SQLite
    nodeVersion: "22.5.0"
    # The backend code lives in the backend/ subdirectory
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "node server.js"
    # Render auto-assigns PORT — server.js reads process.env.PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        # Replace with your actual Netlify URL after frontend deploys
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      # Optional — uncomment if you use these:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: GOOGLE_MAPS_API_KEY
      #   sync: false
      # - key: RESEND_API_KEY
      #   sync: false